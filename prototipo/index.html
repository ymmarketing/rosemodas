<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose Menezes · Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rosa:#F4DCDC; --rosa-2:#FAEDED; --nude:#EFE4D8; --perola:#FBF8F4; --branco:#FFFFFF;
  --rose:#C99A9A; --vinho:#9C4A5C; --vinho-2:#7E3546; --dourado:#B98B4E; --champ:#D8C3A5;
  --taupe:#6E5F5A; --tinta:#3D3230; --linha:#EADFD6; --linha-2:#F2EAE3;
  --ok:#5E8B6A; --ok-bg:#E8F1EA; --warn:#B07A2A; --warn-bg:#F8EEDC; --bad:#B0444F; --bad-bg:#F8E3E5; --info:#5B7393; --info-bg:#E6ECF4;
  --serif:'Playfair Display',Georgia,serif; --sans:'Montserrat',system-ui,sans-serif; --script:'Great Vibes',cursive;
  --r:14px; --sh:0 10px 30px rgba(110,95,90,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--perola);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--tinta)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;color:var(--vinho);line-height:1.2}
.hidden{display:none!important}
.muted{color:var(--taupe)} .small{font-size:12.5px} .xs{font-size:11.5px}
.script{font-family:var(--script);color:var(--dourado);font-weight:400}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dourado);font-weight:600}
.num{font-family:var(--serif);font-variant-numeric:lining-nums}

/* ---------- barra do protótipo ---------- */
#proto{position:sticky;top:0;z-index:60;background:var(--tinta);color:#f3e9e4;display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:12px;overflow-x:auto;white-space:nowrap}
#proto b{font-weight:600;letter-spacing:.12em;font-size:10.5px;color:var(--champ);margin-right:6px}
#proto a{padding:5px 11px;border-radius:999px;color:#e9dcd6}
#proto a.on{background:var(--vinho);color:#fff}
#proto .sp{flex:1}

/* ---------- botões, campos, selos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:.15s}
.btn-p{background:var(--vinho);color:#fff} .btn-p:hover{background:var(--vinho-2)}
.btn-s{background:var(--branco);border:1px solid var(--linha);color:var(--vinho)} .btn-s:hover{border-color:var(--rose)}
.btn-g{background:#3E8E5C;color:#fff}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-block{width:100%}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--taupe)}
.input{width:100%;border:1px solid var(--linha);background:var(--branco);border-radius:10px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rosa-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)} .t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)} .t-neu{background:var(--linha-2);color:var(--taupe)} .t-rose{background:var(--rosa);color:var(--vinho)} .t-gold{background:#F4EBDD;color:#8C6630}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--champ);font-size:11.5px;color:var(--taupe);background:var(--branco)}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--linha);background:var(--branco);font-size:13px;white-space:nowrap}
.chip.on{background:var(--vinho);border-color:var(--vinho);color:#fff}

/* ============================== LOJA ============================== */
.s-top{background:var(--rosa);color:var(--vinho);text-align:center;font-size:12px;font-weight:500;padding:8px 12px;letter-spacing:.02em}
.s-head{position:sticky;top:33px;z-index:40;background:rgba(251,248,244,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--linha)}
.s-head .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.s-logo{display:flex;align-items:center;gap:10px}
.s-logo img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--linha)}
.s-logo .n{font-family:var(--serif);color:var(--vinho);font-size:19px;line-height:1}
.s-logo .n small{display:block;font-family:var(--sans);font-size:8.5px;letter-spacing:.3em;color:var(--dourado);margin-top:3px}
.s-nav{display:flex;gap:22px;margin-left:24px;font-size:13.5px}
.s-nav a:hover,.s-nav a.on{color:var(--vinho)}
.s-ic{display:flex;gap:4px;margin-left:auto}
.s-ic a{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.s-ic a:hover{background:var(--rosa-2)}
.s-ic svg{width:21px;height:21px;stroke:var(--vinho);fill:none;stroke-width:1.5}
.badge{position:absolute;top:3px;right:2px;background:var(--vinho);color:#fff;font-size:10px;font-weight:600;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.s-menu-btn{display:none}
@media(max-width:860px){.s-nav{display:none}.s-menu-btn{display:flex!important}}
.s-wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.s-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding:28px 0 18px}
.s-hero h1{font-size:clamp(30px,5vw,46px)}
.s-hero p{margin:10px 0 18px;color:var(--taupe);max-width:460px}
.s-hero .art{background:var(--rosa-2);border-radius:28px;aspect-ratio:5/4;display:flex;align-items:center;justify-content:center;overflow:hidden}
@media(max-width:760px){.s-hero{grid-template-columns:1fr;padding-top:18px}.s-hero .art{display:none}}
.s-cats{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.s-bar{display:flex;align-items:center;gap:10px;padding:10px 0 14px;border-bottom:1px solid var(--linha);margin-bottom:18px;flex-wrap:wrap}
.s-bar .cnt{font-size:13px;color:var(--taupe);margin-right:auto}
.s-bar select{border:1px solid var(--linha);border-radius:999px;padding:8px 12px;background:var(--branco)}
.s-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px}
@media(max-width:980px){.s-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.s-grid{grid-template-columns:repeat(2,1fr);gap:18px 12px}}
.card{display:block;position:relative}
.card .im{display:block;position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--rosa-2)}
.card .im svg{width:100%;height:100%;display:block}
.card .sel{position:absolute;top:10px;left:10px}
.card .fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.card .fav svg{width:17px;height:17px;stroke:var(--vinho);fill:none;stroke-width:1.6}
.card .fav.on svg{fill:var(--vinho)}
.card .esg{position:absolute;inset:0;background:rgba(251,248,244,.62);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:14px;gap:8px}
.card .nm{margin-top:10px;font-size:14px;font-weight:500}
.card .pr{font-family:var(--serif);color:var(--vinho);font-size:17px;margin-top:2px}
.card .pr s{font-family:var(--sans);font-size:12px;color:var(--taupe);margin-right:6px}
.card .pc{font-size:12px;color:var(--taupe)}
.card .sz{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.card .sz span{font-size:10.5px;border:1px solid var(--linha);border-radius:6px;padding:1px 5px;color:var(--taupe)}
.card .sz span.x{text-decoration:line-through;opacity:.5}
.s-foot{margin-top:56px;background:var(--rosa);color:var(--vinho)}
.s-foot .in{max-width:1180px;margin:0 auto;padding:36px 16px 20px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px}
@media(max-width:700px){.s-foot .in{grid-template-columns:1fr}}
.s-foot h4{font-size:16px;margin-bottom:10px}
.s-foot a{display:block;font-size:13.5px;padding:3px 0;color:var(--tinta)}
.s-foot .bot{max-width:1180px;margin:0 auto;padding:12px 16px 22px;font-size:11.5px;color:var(--taupe);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid rgba(156,74,92,.15)}
.wa-float{position:fixed;right:16px;bottom:18px;z-index:45;width:54px;height:54px;border-radius:50%;background:#3E8E5C;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.wa-float svg{width:28px;height:28px;fill:#fff}
/* produto */
.s-crumb{font-size:12px;color:var(--taupe);padding:14px 0}
.s-crumb a:hover{color:var(--vinho)}
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:36px}
@media(max-width:820px){.pdp{grid-template-columns:1fr;gap:18px}}
.gal .main{border-radius:20px;overflow:hidden;aspect-ratio:4/5;background:var(--rosa-2)}
.gal .main svg{width:100%;height:100%;display:block}
.gal .th{display:flex;gap:8px;margin-top:8px}
.gal .th div{width:64px;height:80px;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer}
.gal .th div.on{border-color:var(--vinho)}
.gal .th svg{width:100%;height:100%;display:block}
.pinfo h1{font-size:clamp(26px,4vw,34px)}
.pinfo .code{font-size:11.5px;color:var(--taupe);letter-spacing:.08em;margin-top:4px}
.pinfo .price{font-family:var(--serif);font-size:30px;color:var(--vinho);margin-top:12px}
.pinfo .parc{font-size:13px;color:var(--taupe)}
.blk{margin-top:20px}
.blk h5{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--taupe);margin-bottom:8px;display:flex;justify-content:space-between}
.cores{display:flex;gap:10px}
.cores button{width:34px;height:34px;border-radius:50%;border:2px solid var(--branco);box-shadow:0 0 0 1px var(--linha)}
.cores button.on{box-shadow:0 0 0 2px var(--vinho)}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{min-width:52px;height:46px;border-radius:12px;border:1px solid var(--linha);background:var(--branco);font-weight:600;position:relative}
.sizes button.on{border-color:var(--vinho);background:var(--vinho);color:#fff}
.sizes button.off{color:#bbb;background:var(--linha-2)}
.sizes button.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:1px solid #c9bdb6;transform:rotate(-20deg)}
.sizes button .lt{position:absolute;bottom:-17px;left:0;right:0;font-size:9.5px;color:var(--warn);font-weight:600}
.veste{font-size:13px;margin-top:22px;padding:10px 12px;background:var(--rosa-2);border-radius:10px;color:var(--vinho)}
.meas{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--branco);border-radius:12px;overflow:hidden;border:1px solid var(--linha)}
.meas td{padding:9px 12px;border-bottom:1px solid var(--linha-2)}
.meas td:last-child{text-align:right;font-weight:600;color:var(--vinho)}
.frete{display:flex;gap:8px}
.frete-res{margin-top:10px;display:grid;gap:6px}
.frete-res div{display:flex;justify-content:space-between;background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;font-size:13.5px}
.buy{display:grid;gap:10px;margin-top:22px}
.revs{margin-top:44px;border-top:1px solid var(--linha);padding-top:26px}
.rev{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:16px;margin-top:12px}
.stars{color:var(--dourado);letter-spacing:2px}
/* carrinho / checkout */
.s-page{max-width:980px;margin:0 auto;padding:22px 16px}
.s-page h1{font-size:30px;margin-bottom:16px}
.cart{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}
@media(max-width:780px){.cart{grid-template-columns:1fr}}
.citem{display:flex;gap:14px;background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:12px;margin-bottom:10px}
.citem .im{width:84px;height:104px;border-radius:10px;overflow:hidden;flex-shrink:0}
.citem .im svg{width:100%;height:100%}
.qty{display:inline-flex;align-items:center;border:1px solid var(--linha);border-radius:999px;margin-top:8px}
.qty button{width:30px;height:30px;font-size:16px;color:var(--vinho)}
.qty span{min-width:22px;text-align:center;font-weight:600}
.sum{background:var(--branco);border:1px solid var(--linha);border-radius:18px;padding:18px;height:fit-content;position:sticky;top:110px}
.sum .row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sum .tot{border-top:1px solid var(--linha);margin-top:8px;padding-top:12px;font-family:var(--serif);font-size:22px;color:var(--vinho)}
.steps{display:flex;gap:6px;margin-bottom:18px;font-size:12px}
.steps span{flex:1;text-align:center;padding:8px 4px;border-bottom:2px solid var(--linha);color:var(--taupe)}
.steps span.on{border-color:var(--vinho);color:var(--vinho);font-weight:600}
.box{background:var(--branco);border:1px solid var(--linha);border-radius:18px;padding:18px;margin-bottom:14px}
.box h3{font-size:19px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--linha);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--vinho);background:var(--rosa-2)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--rose);flex-shrink:0}
.opt.on .dot{border:5px solid var(--vinho)}
.opt .r{margin-left:auto;font-weight:600;color:var(--vinho)}
.conf{text-align:center;max-width:560px;margin:0 auto}
.conf .ok{width:66px;height:66px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:10px auto 14px;font-size:30px}
.qr{width:170px;height:170px;margin:14px auto;background:repeating-linear-gradient(90deg,var(--tinta) 0 6px,#fff 6px 10px),repeating-linear-gradient(0deg,var(--tinta) 0 6px,#fff 6px 12px);background-blend-mode:multiply;border:10px solid #fff;outline:1px solid var(--linha);border-radius:8px}
.timer{display:inline-flex;gap:6px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.prose{max-width:760px;margin:0 auto;padding:26px 16px}
.prose h1{font-size:clamp(28px,5vw,40px)}
.prose h2{font-size:22px;margin:26px 0 8px}
.prose p,.prose li{color:var(--tinta);margin-bottom:10px}
.prose ul{padding-left:20px}
.prose .quote{font-family:var(--serif);font-style:italic;color:var(--vinho);font-size:20px;border-left:2px solid var(--dourado);padding:4px 0 4px 18px;margin:18px 0}
.qs-hero{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;margin:16px 0 8px}
.qs-hero img{width:200px;height:200px;border-radius:50%;object-fit:cover;border:1px solid var(--linha)}
@media(max-width:600px){.qs-hero{grid-template-columns:1fr;text-align:center}.qs-hero img{margin:0 auto;width:160px;height:160px}}
.acc{border:1px solid var(--linha);border-radius:14px;background:var(--branco);margin-bottom:10px}
.acc summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.acc summary::after{content:"+";color:var(--vinho);font-size:18px}
.acc[open] summary::after{content:"–"}
.acc div{padding:0 16px 14px;color:var(--taupe)}
/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(61,50,48,.35);z-index:80;display:flex;justify-content:flex-end}
.drawer{width:min(380px,90vw);height:100%;background:var(--perola);padding:20px;overflow:auto}
.drawer h3{font-size:22px;margin-bottom:14px}

/* ============================== ÁREA DA CLIENTE ============================== */
.c-wrap{max-width:1000px;margin:0 auto;padding:20px 16px}
.c-hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.c-hello h1{font-size:30px}
.c-tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--linha);margin-bottom:18px;scrollbar-width:none}
.c-tabs a{padding:10px 14px;font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent;color:var(--taupe)}
.c-tabs a.on{border-color:var(--vinho);color:var(--vinho);font-weight:600}
.c-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.c-grid{grid-template-columns:1fr}}
.c-card{background:var(--branco);border:1px solid var(--linha);border-radius:18px;padding:18px}
.c-card.hl{background:linear-gradient(135deg,var(--rosa-2),var(--branco));border-color:var(--rosa)}
.olist .o{display:flex;align-items:center;gap:14px;background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:14px;margin-bottom:10px}
.olist .o .im{width:56px;height:70px;border-radius:8px;overflow:hidden;flex-shrink:0}
.olist .o .im svg{width:100%;height:100%}
.olist .o .r{margin-left:auto;text-align:right}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--linha)}
.tl .ev{position:relative;padding-bottom:16px}
.tl .ev::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--branco);border:2px solid var(--linha)}
.tl .ev.done::before{background:var(--vinho);border-color:var(--vinho)}
.tl .ev.now::before{background:var(--branco);border-color:var(--vinho);box-shadow:0 0 0 4px var(--rosa)}
.tl .ev b{font-weight:600;font-size:14px}
.tl .ev .xs{display:block}
.login{max-width:420px;margin:30px auto;background:var(--branco);border:1px solid var(--linha);border-radius:22px;padding:28px;box-shadow:var(--sh);text-align:center}
.login img{width:84px;height:84px;border-radius:50%;object-fit:cover}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--linha-2);gap:10px}
.tog{width:44px;height:24px;border-radius:999px;background:var(--linha);position:relative;flex-shrink:0;cursor:pointer}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--vinho)} .tog.on::after{left:23px}

/* ============================== PAINEL ============================== */
.p{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 33px)}
.p-side{background:var(--branco);border-right:1px solid var(--linha);padding:18px 14px;position:sticky;top:33px;height:calc(100vh - 33px);overflow:auto}
.p-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px;border-bottom:1px solid var(--linha-2);margin-bottom:12px}
.p-brand img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.p-brand .n{font-family:var(--serif);color:var(--vinho);font-size:16px;line-height:1.1}
.p-brand .n small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.14em;color:var(--dourado);text-transform:uppercase}
.p-nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:var(--taupe);margin-bottom:2px}
.p-nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;flex-shrink:0}
.p-nav a:hover{background:var(--perola);color:var(--vinho)}
.p-nav a.on{background:var(--rosa-2);color:var(--vinho);font-weight:600}
.p-nav .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--vinho);color:#fff;border-radius:999px;padding:1px 7px}
.p-nav .cnt.w{background:var(--warn)} .p-nav .cnt.b{background:var(--bad)}
.p-nav .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--champ);font-weight:700;padding:14px 10px 6px}
.p-main{min-width:0}
.p-top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--linha);background:rgba(251,248,244,.95);position:sticky;top:33px;z-index:30}
.p-top .search{flex:1;max-width:420px;position:relative}
.p-top .search input{width:100%;border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:9px 14px 9px 36px}
.p-top .search svg{position:absolute;left:12px;top:10px;width:16px;height:16px;stroke:var(--taupe);fill:none;stroke-width:1.6}
.p-user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.p-user .av{width:34px;height:34px;border-radius:50%;background:var(--rosa);color:var(--vinho);display:flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--serif)}
.p-body{padding:22px 26px 60px;max-width:1320px}
.p-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.p-h h1{font-size:28px}
.p-h p{color:var(--taupe);font-size:13.5px;margin-top:2px}
.p-mob{display:none}
@media(max-width:960px){
 .p{grid-template-columns:1fr}
 .p-side{display:none}
 .p-mob{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--branco);border-bottom:1px solid var(--linha);position:sticky;top:33px;z-index:31;scrollbar-width:none}
 .p-mob a{padding:7px 12px;border-radius:999px;font-size:12.5px;white-space:nowrap;color:var(--taupe)}
 .p-mob a.on{background:var(--rosa-2);color:var(--vinho);font-weight:600}
 .p-top{top:84px;padding:10px 14px}
 .p-body{padding:16px 14px 50px}
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:16px 18px}
.kpi .l{font-size:12px;color:var(--taupe);font-weight:500;display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-family:var(--serif);font-size:28px;color:var(--tinta);margin-top:6px;line-height:1.1}
.kpi .d{font-size:12px;margin-top:6px}
.kpi.hero{background:var(--vinho);border-color:var(--vinho);color:#fff}
.kpi.hero .l,.kpi.hero .d{color:#f1dfe2} .kpi.hero .v{color:#fff;font-size:32px}
.kpi.soft{background:var(--rosa-2);border-color:var(--rosa)}
.up{color:var(--ok);font-weight:600} .down{color:var(--bad);font-weight:600}
.panel{background:var(--branco);border:1px solid var(--linha);border-radius:18px;padding:18px}
.panel h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h3 a{font-family:var(--sans);font-size:12.5px;color:var(--vinho);font-weight:600}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}
@media(max-width:1100px){.dgrid{grid-template-columns:1fr}}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linha-2)}
.alert:last-child{border-bottom:none}
.alert .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:700}
.alert .t{font-size:13.5px;font-weight:600}
.alert .s{font-size:12.5px;color:var(--taupe)}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.shortcuts{grid-template-columns:repeat(2,1fr)}}
.shortcuts a{background:var(--perola);border:1px solid var(--linha);border-radius:14px;padding:14px;font-size:13px;font-weight:600;color:var(--vinho);display:flex;flex-direction:column;gap:6px}
.shortcuts a:hover{border-color:var(--rose);background:var(--rosa-2)}
.shortcuts a span{font-size:20px}
.tbl{width:100%;overflow-x:auto;background:var(--branco);border:1px solid var(--linha);border-radius:16px}
table.t{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--taupe);font-weight:600;padding:12px 14px;background:var(--perola);border-bottom:1px solid var(--linha);white-space:nowrap}
table.t td{padding:12px 14px;border-bottom:1px solid var(--linha-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover{background:#FDFAF7}
table.t tr.click{cursor:pointer}
.rn{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:8px 12px;font-size:13px}
.filters .lnk{font-size:12.5px;color:var(--vinho);font-weight:600;margin-left:4px}
.seg{display:inline-flex;background:var(--linha-2);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-size:12.5px;color:var(--taupe);font-weight:500}
.seg button.on{background:var(--branco);color:var(--vinho);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--rosa);color:var(--vinho);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:14px;flex-shrink:0}
.who .av.v{background:var(--vinho);color:#fff}
.empty{text-align:center;padding:36px 12px;color:var(--taupe)}
.empty .script{font-size:30px;display:block}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:12.5px;color:var(--taupe)}
/* ficha da cliente */
.fx-head{background:var(--branco);border:1px solid var(--linha);border-radius:20px;padding:22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
@media(max-width:820px){.fx-head{grid-template-columns:1fr}}
.fx-head .av{width:72px;height:72px;border-radius:50%;background:var(--vinho);color:#fff;font-family:var(--serif);font-size:28px;display:flex;align-items:center;justify-content:center}
.fx-head h1{font-size:32px;color:var(--tinta)}
.fx-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.fx-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.fx-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
@media(max-width:900px){.fx-sum{grid-template-columns:repeat(2,1fr)}}
.fx-sum div{background:var(--rosa-2);border-radius:14px;padding:12px 14px}
.fx-sum .l{font-size:11.5px;color:var(--taupe)}
.fx-sum .v{font-family:var(--serif);font-size:21px;color:var(--vinho)}
.fx-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
@media(max-width:1000px){.fx-cols{grid-template-columns:1fr}}
.sec-t{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dourado);font-weight:700;margin:20px 0 8px}
.note{background:#FFFBF2;border:1px solid #F0E3C8;border-radius:14px;padding:14px;font-size:13.5px}
.inter{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha-2)}
.inter:last-child{border-bottom:none}
.inter .ch{width:30px;height:30px;border-radius:50%;background:var(--perola);border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.cons{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha-2);font-size:13px}
.cons:last-child{border-bottom:none}
details.hist{background:var(--branco);border:1px solid var(--linha);border-radius:16px;margin-top:12px}
details.hist summary{padding:14px 18px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--taupe);list-style:none}
details.hist summary::before{content:"▸ ";color:var(--vinho)}
details.hist[open] summary::before{content:"▾ "}
details.hist .in{padding:0 18px 14px;font-size:12.5px;color:var(--taupe)}
details.hist .in div{padding:6px 0;border-bottom:1px dashed var(--linha-2);display:flex;gap:12px}
details.hist .in code{font-size:11px;color:var(--taupe);background:var(--perola);padding:1px 6px;border-radius:4px}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kan.k6{grid-template-columns:repeat(6,minmax(200px,1fr))}
.col{background:var(--linha-2);border-radius:16px;padding:10px;min-height:200px}
.col h4{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--taupe);display:flex;justify-content:space-between;padding:4px 4px 10px}
.kc{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:12px;margin-bottom:8px;font-size:13px}
.kc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.kc .top b{font-size:12.5px;color:var(--vinho)}
.kc .it{font-size:12px;color:var(--taupe);margin:4px 0 8px}
.kc .ft{display:flex;justify-content:space-between;align-items:center;gap:6px}
/* estoque */
.bar{height:6px;border-radius:999px;background:var(--linha-2);overflow:hidden;width:90px;display:flex}
.bar i{display:block;height:100%}
.thumb{width:38px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0}
.thumb svg{width:100%;height:100%}
/* financeiro */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--branco);border:1px solid var(--linha);border-radius:18px;overflow:hidden}
.flow div{padding:16px 16px;border-right:1px solid var(--linha-2);position:relative}
.flow div:last-child{border-right:none}
.flow .l{font-size:12px;color:var(--taupe)} .flow .v{font-family:var(--serif);font-size:24px;margin-top:4px}
.flow .h{font-size:11.5px;color:var(--taupe);margin-top:4px}
@media(max-width:900px){.flow{grid-template-columns:1fr 1fr}.flow div{border-bottom:1px solid var(--linha-2)}}
/* campanhas */
.camp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1000px){.camp{grid-template-columns:1fr}}
.cc{background:var(--branco);border:1px solid var(--linha);border-radius:18px;overflow:hidden}
.cc .bn{padding:14px 16px;background:var(--rosa);color:var(--vinho);font-family:var(--serif);font-size:18px}
.cc .bd{padding:14px 16px}
.cc .ln{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--linha-2);font-size:13px}
.cc .ln:last-child{border-bottom:none}
.cc .ln .k{width:26px;height:26px;border-radius:8px;background:var(--perola);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
/* saúde */
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1000px){.hgrid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.hgrid{grid-template-columns:1fr}}
.hc{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:16px;border-left:4px solid var(--ok)}
.hc.w{border-left-color:var(--warn)} .hc.b{border-left-color:var(--bad)}
.hc .v{font-family:var(--serif);font-size:28px}
.integ{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha-2);font-size:13.5px}
.integ:last-child{border-bottom:none}
.dotc{width:9px;height:9px;border-radius:50%;flex-shrink:0}
/* modal e toast */
.mbg{position:fixed;inset:0;background:rgba(61,50,48,.4);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--perola);border-radius:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--linha)}
.modal .mh h3{font-size:21px}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--linha)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:999px;font-size:13.5px;z-index:99;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--taupe);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>

function closeLayer(){ $('#layer').innerHTML='' }
function modal(title, body, foot){

  <div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div></div>`;
}

function art(p, corIdx=0, variant=0, fit='slice'){
  const c = p.cores[corIdx] || p.cores[0];
  const bgs = ['#FAEDED','#F3EBE2','#F7F1EA','#F6E6E6'];
  const bg = bgs[(p.n + variant) % bgs.length];
  const tilt = variant===1 ? 'rotate(-4 100 140)' : variant===2 ? 'translate(0 6) scale(.94) translate(6 0)' : '';
  return `<svg viewBox="0 0 200 260" preserveAspectRatio="xMidYMid ${fit}" role="img" aria-label="${esc(p.nome)}">
    <rect width="200" height="260" fill="${bg}"/>
    <circle cx="100" cy="138" r="${variant===2?92:84}" fill="#fff" opacity=".55"/>
    <path d="M100 30 v12 M80 44 Q100 30 120 44" stroke="${'#B98B4E'}" stroke-width="1.6" fill="none" opacity=".7"/>
    <g transform="${tilt}" fill="${c.hex}" stroke="rgba(0,0,0,.08)" stroke-width="1">${SHAPES[p.forma]}</g>
  </svg>`;
}

}
function route(){
  closeLayer();
  const h = location.hash.replace(/^#\/?/,'') || 'loja';
  const [area, a, b] = h.split('/');
  protoBar(area);
  window.scrollTo(0,0);
  if(area==='painel') return renderPainel(a||'inicio', b);
  if(area==='cliente') return renderCliente(a||'inicio', b);
  return renderLoja(a||'inicio', b);
}
